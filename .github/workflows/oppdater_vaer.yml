name: Oppdater Vaer Data Eksternt

on:
  schedule:
    - cron: '0 * * * *' # Kjører en gang i timen døgnet rundt
  workflow_dispatch:

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
    - name: Hent kildekode
      uses: actions/checkout@v4

    - name: Sett opp Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer biblioteker
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Kjor vaerskriptet
      run: python vaer_toppliste.py
