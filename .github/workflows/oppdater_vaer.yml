name: Oppdater Vaer Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  oppdater:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Tvinger GitHub til å bruke Node 20 for modulene, slik at du slipper advarsler
    env:
      FORCE_NODE_VERSION: 'node20'

    steps:
    - name: Hent kildekode
      uses: actions/checkout@v4

    - name: Sett opp Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer biblioteker
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Kjor vaerskriptet
      run: python vaer_toppliste.py

    - name: Commit og push endringer
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add docs/toppliste.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisk oppdatering av vaerdata" && git push)
